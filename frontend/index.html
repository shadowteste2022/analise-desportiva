<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análise Desportiva</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--fg:#141a22;--muted:#5d6876;--line:#e2e6eb;--soft:#f6f8fa;--accent:#0b7a5c;--accent2:#0f5ec7;
  --ok:#137a3a;--okbg:#ddf6e5;--warn:#8a5a00;--warnbg:#fff3c4;--onaccent:#fff;
  --p1:#0f5ec7;--px:#9aa4b0;--p2:#d9480f;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#131a22;--fg:#e7edf3;--muted:#8e99a6;--line:#26303b;--soft:#18212b;--accent:#2fbf8f;--accent2:#5aa2ff;
  --ok:#3fcf73;--okbg:#10301d;--warn:#e0a82e;--warnbg:#2e2410;--onaccent:#04140e;
  --p1:#5aa2ff;--px:#6b7682;--p2:#ff8a4c;--shadow:none}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent2)}
/* header */
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--onaccent);font-style:normal;font-size:15px}
.upd{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.upd .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:17px;margin:22px 0 10px;letter-spacing:-.01em}
h3{font-size:12px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)} .small{font-size:12px}
/* highlights */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.hl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.hl h4{margin:0 0 8px;font-size:13px}
.hl .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
.hl .it:first-of-type{border-top:0}
.hl .it:hover b{color:var(--accent)}
.hl .it span{min-width:0} .hl .it b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl .it .small{display:block}
.hl .it em{font-style:normal;font-weight:700;white-space:nowrap}
/* filters */
.filters{position:sticky;top:53px;z-index:4;background:var(--bg);padding:8px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.chip{border:0;background:none;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--onaccent);font-weight:600}
.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;max-width:220px}
.filters input[type=search]{flex:1;min-width:160px}
/* game list */
.day{font-size:13px;font-weight:700;color:var(--muted);margin:18px 2px 6px;text-transform:capitalize}
.game{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:130px}
.game.open{border-color:var(--accent)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) 170px minmax(0,260px);gap:14px;align-items:center;padding:10px 14px;cursor:pointer}
.row:hover{background:var(--soft)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.time{font-weight:700;font-variant-numeric:tabular-nums}
.teams{min-width:0} .teams b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teams .comp{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.pbar span{display:block}
.plab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.pred{font-size:13px;min-width:0}
.pred .lk{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pred .lk span{font-weight:400;color:var(--muted)}
.pred .gl{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{display:block;margin:12px auto}
/* inline analysis */
.detail{border-top:1px solid var(--line);padding:14px;background:var(--soft)}
.verdict{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px}
.verdict .big{font-size:18px;font-weight:700;margin:2px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.fact{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fact span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fact b{font-size:15px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 10px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}
.tbl{width:100%;overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:600;font-size:12px;background:var(--soft)}
.warn{background:var(--warnbg);color:var(--warn);padding:9px 12px;border-radius:8px;margin:8px 0;font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pcard h4{margin:0 0 6px;font-size:13px}
.pcard table{font-size:13px} .pcard th,.pcard td{padding:4px 6px;white-space:normal}
.pcard .note{font-size:11px;color:var(--muted);margin-top:6px}
.pv{font-weight:600;white-space:nowrap}
.hi{background:var(--okbg)}
.heat td{text-align:center;font-size:12px;padding:4px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
ul{margin:4px 0;padding-left:20px}
details.how{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:24px}
details.how summary{cursor:pointer;font-weight:600}
footer{max-width:1100px;margin:0 auto;padding:8px 16px 32px;color:var(--muted);font-size:12px}
@media (max-width:760px){
  .row{grid-template-columns:46px minmax(0,1fr);gap:8px}
  .row .probs{display:none}
  .row .pred{grid-column:2;grid-row:2}
  .upd .t{display:none}
  .filters{position:static}
  .filters select{max-width:none;flex:1}
  main{padding:10px}
  th,td{padding:6px 6px}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand"><i aria-hidden="true">%</i>Análise Desportiva</div>
  <div class="upd" id="upd"></div>
</div></div>
<main id="app"><p class="muted">A carregar…</p></main>
<footer>Análise estatística e previsões. As probabilidades são estimativas com erro, não certezas: um resultado com 70% falha 3 vezes em cada 10.</footer>

<script>
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (x, d = 1) => x == null ? '—' : (x * 100).toFixed(d) + '%';
const num = (x, d = 2) => x == null ? '—' : Number(x).toFixed(d);
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};
const REFRESH_MS = 5 * 60e3;  // the data changes hourly; checking every 5 min keeps an open page current

// Static site (GitHub Pages): the same API answers, precomputed by backend/app/export.py into relative JSON files.
const slug = k => k.replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '');  // same rule as export.slug
function staticPath(path) {
  const u = new URL(path, 'http://x');
  if (u.pathname === '/api/match') return `data/match/${slug(u.searchParams.get('key'))}.json`;
  return `data/${u.pathname.replace('/api/', '')}.json`;
}
async function api(path, opts) {
  // no-cache = revalidate with GitHub Pages (cheap, ETag) so an hourly update never mixes a new page with old data
  const r = await fetch(window.STATIC ? staticPath(path) : path, {cache: 'no-cache', ...opts});
  if (window.STATIC && r.status === 404) throw new Error('Este jogo já não está na lista atual.');
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail ? JSON.stringify(body.detail) : r.statusText);
  return body;
}
const err = e => `<div class="warn">Erro: ${esc(e.message)}</div>`;

// ---------- wording ----------
const UNIT = {Futebol: 'golos', 'Hóquei no gelo': 'golos', Andebol: 'golos', Basquetebol: 'pontos', 'Futebol americano': 'pontos',
  'Futebol australiano': 'pontos', 'Râguebi': 'pontos', 'Ténis': 'jogos', Basebol: 'corridas', 'Críquete': 'corridas', MMA: 'rondas', Boxe: 'rondas', Voleibol: 'pontos'};
// same wording as analysis.pick_label
function selLabel(m, s, home, away) {
  if (m === '1X2' || m === 'Vencedor') return {'1': `Vitória ${home}`, X: 'Empate', '2': `Vitória ${away}`}[s] || s;
  if (m === 'DC') return {'1X': `${home} ou empate`, '12': `${home} ou ${away}`, X2: `Empate ou ${away}`}[s] || s;
  if (m.startsWith('AH')) { const h = +m.slice(2); return s === '1' ? `${home} ${h > 0 ? '+' : ''}${h}` : `${away} ${-h > 0 ? '+' : ''}${-h}`; }
  if (m === 'HT1X2') return {'1': `${home} ao intervalo`, X: 'Empate ao intervalo', '2': `${away} ao intervalo`}[s] || s;
  if (m === '2H1X2') return {'1': `${home} ganha a 2.ª parte`, X: '2.ª parte empatada', '2': `${away} ganha a 2.ª parte`}[s] || s;
  if (m === 'CS') return `${s === '1' ? home : away} sem sofrer golos`;
  if (m === 'WM') return s === 'X' ? 'Empate' : `${s[0] === '1' ? home : away} ganha ${s.slice(2)}`;
  if (m === 'MP') return s === 'Igual' ? 'Igual nas duas partes' : `Mais golos na ${s}`;
  return `${m} ${s}`;
}
const hm = iso => new Date(iso).toLocaleTimeString('pt-PT', {hour: '2-digit', minute: '2-digit'});
const dt = iso => iso ? new Date(iso).toLocaleString('pt-PT', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}) : '—';
function dayLabel(x) {
  if (!x.kickoff) return x.date;
  const d = new Date(x.kickoff), diff = Math.round((new Date(d.toDateString()) - new Date(new Date().toDateString())) / 864e5);
  return diff === 0 ? 'Hoje' : diff === 1 ? 'Amanhã' : d.toLocaleDateString('pt-PT', {weekday: 'long', day: 'numeric', month: 'long'});
}
function probBar(p) {
  const parts = [['1', 'var(--p1)'], ['X', 'var(--px)'], ['2', 'var(--p2)']].filter(([k]) => p[k] != null);
  return `<div class="pbar">${parts.map(([k, c]) => `<span style="width:${(p[k] * 100).toFixed(1)}%;background:${c}"></span>`).join('')}</div>
    <div class="plab">${parts.map(([k]) => `<span>${k} ${pct(p[k], 0)}</span>`).join('')}</div>`;
}
const likelyOf = p => Object.keys(p).reduce((a, b) => p[a] >= p[b] ? a : b);
function predCell(x) {
  const p = x.probs_1x2, k = likelyOf(p);
  const gl = [x.over25 != null ? `Mais de 2.5 golos ${pct(x.over25, 0)}` : '', x.btts != null ? `Ambas marcam ${pct(x.btts, 0)}` : ''].filter(Boolean).join(' · ');
  return `<span class="lk">${esc(selLabel('1X2', k, x.home, x.away))} <span>${pct(p[k], 0)}</span></span>${gl ? `<span class="gl">${gl}</span>` : ''}`;
}

// ---------- state ----------
const S = {data: null, reports: new Map(), open: new Set(), tab: {}, limit: 60,
  f: Object.assign({when: 'all', sport: '', league: '', q: '', onlyForecast: false}, JSON.parse(store.get('filters4') || '{}'))};

// ---------- page ----------
async function load(first) {
  const data = await api('/api/fixtures');
  const changed = !S.data || S.data.generated_at !== data.generated_at;
  S.data = data;
  renderUpd();
  if (!changed && !first) return;
  S.reports.clear();  // new hourly data: open analyses are refreshed from it
  if (first) renderShell(); else { renderHighlights(); renderList(); }
}
function renderUpd() {
  const g = S.data?.generated_at;
  const mins = g ? Math.round((Date.now() - Date.parse(g)) / 60e3) : null;
  document.getElementById('upd').innerHTML = g ? `<span class="dot"></span><span class="t">Dados de ${hm(g)} · </span>${mins < 1 ? 'agora' : `há ${mins} min`}` : '';
}
// games that have not kicked off over 2 h ago (hidden even if the hourly update is late)
const live = fx => fx.filter(x => !(x.kickoff && Date.parse(x.kickoff) < Date.now() - 2 * 3600e3));
const forecast = fx => live(fx).filter(x => x.probs_1x2);
function renderShell() {
  const fx = live(S.data.fixtures);
  const sports = [...new Set(fx.map(x => x.sport))].sort((a, b) => (a !== 'Futebol') - (b !== 'Futebol') || a.localeCompare(b));
  const comps = [...new Map(fx.map(x => [x.league, x])).values()]
    .sort((a, b) => (a.sport !== 'Futebol') - (b.sport !== 'Futebol') || a.competition.localeCompare(b.competition));
  $app.innerHTML = `<section id="highlights"></section>
    <h2>Jogos</h2>
    <div class="filters">
      <div class="chips" role="group" aria-label="Quando">${[['all', 'Todos'], ['0', 'Hoje'], ['1', 'Amanhã'], ['7', '7 dias']].map(([v, l]) =>
        `<button class="chip ${S.f.when === v ? 'on' : ''}" data-when="${v}">${l}</button>`).join('')}</div>
      <select id="f-sport" aria-label="Modalidade"><option value="">Todas as modalidades</option>${sports.map(s => `<option>${esc(s)}</option>`).join('')}</select>
      <select id="f-league" aria-label="Competição"><option value="">Todas as competições</option>${comps.map(x => `<option value="${esc(x.league)}" data-sport="${esc(x.sport)}">${esc(x.competition)}</option>`).join('')}</select>
      <input type="search" id="f-q" placeholder="Pesquisar equipa ou jogador" aria-label="Pesquisar">
      <label class="small muted" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="f-fc"> Só com previsão</label>
    </div>
    <div id="list"></div>
    <details class="how" id="how"><summary>Como funcionam as previsões</summary><div id="how-body" class="small"><p class="muted">A carregar…</p></div></details>`;
  const fs = document.getElementById('f-sport'), fl = document.getElementById('f-league'), fq = document.getElementById('f-q');
  fs.value = S.f.sport; fl.value = S.f.league; fq.value = S.f.q;
  const upd = () => { S.limit = 60; store.set('filters4', JSON.stringify(S.f)); renderList(); };
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    S.f.when = c.dataset.when; document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); upd(); });
  fs.onchange = () => { S.f.sport = fs.value; if (fs.value && fl.selectedOptions[0]?.dataset.sport !== fs.value) { fl.value = ''; S.f.league = ''; } upd(); };
  fl.onchange = () => { S.f.league = fl.value; upd(); };
  fq.oninput = () => { S.f.q = fq.value; upd(); };
  const fc = document.getElementById('f-fc');
  fc.checked = S.f.onlyForecast;
  fc.onchange = () => { S.f.onlyForecast = fc.checked; upd(); };
  document.getElementById('how').ontoggle = e => e.target.open && renderHow();
  renderHighlights(); renderList();
}

// "Destaques do dia": the games of the next 24 h that stand out in the forecasts
function renderHighlights() {
  const now = Date.now(), fx = forecast(S.data.fixtures).filter(x => x.kickoff && Date.parse(x.kickoff) > now && Date.parse(x.kickoff) < now + 24 * 3600e3);
  const top = p => p[likelyOf(p)];
  const goals = fx.filter(x => x.over25 != null && x.sport === 'Futebol');
  const groups = [
    ['Previsões mais claras', [...fx].sort((a, b) => top(b.probs_1x2) - top(a.probs_1x2)),
      x => [selLabel('1X2', likelyOf(x.probs_1x2), x.home, x.away), pct(top(x.probs_1x2), 0)]],
    ['Jogos mais equilibrados', fx.filter(x => x.probs_1x2.X != null).sort((a, b) => top(a.probs_1x2) - top(b.probs_1x2)),
      x => [`1 ${pct(x.probs_1x2['1'], 0)} · X ${pct(x.probs_1x2.X, 0)} · 2 ${pct(x.probs_1x2['2'], 0)}`, '']],
    ['Mais golos previstos', [...goals].sort((a, b) => b.over25 - a.over25), x => ['Mais de 2.5 golos', pct(x.over25, 0)]],
    ['Menos golos previstos', [...goals].sort((a, b) => a.over25 - b.over25), x => ['Menos de 2.5 golos', pct(1 - x.over25, 0)]]];
  document.getElementById('highlights').innerHTML = fx.length ? `<h2>Destaques do dia</h2><div class="hero">${groups.map(([title, rows, show]) => `<div class="hl"><h4>${title}</h4>
    ${rows.slice(0, 3).map(x => { const [l, v] = show(x); return `<div class="it" data-go="${esc(x.key)}" tabindex="0" role="button">
      <span><b>${esc(x.home)} – ${esc(x.away)}</b><span class="small muted">${x.kickoff ? hm(x.kickoff) : ''} · ${esc(l)}</span></span><em>${v}</em></div>`; }).join('') || '<p class="small muted">Sem jogos.</p>'}</div>`).join('')}</div>
    <p class="small muted">Jogos das próximas 24 horas. «Mais claras» = o resultado mais provável tem a probabilidade mais alta; mesmo assim pode falhar.</p>` : '';
  document.querySelectorAll('[data-go]').forEach(el => el.onclick = el.onkeydown = e => {
    if (e.type === 'keydown' && e.key !== 'Enter') return;
    goTo(el.dataset.go);
  });
}
function goTo(key) {
  if (!filtered().some(x => x.key === key)) {
    Object.assign(S.f, {when: 'all', sport: '', league: '', q: '', onlyForecast: false});
    store.set('filters4', JSON.stringify(S.f)); renderShell();
  }
  const i = filtered().findIndex(x => x.key === key);
  if (i >= S.limit) { S.limit = i + 10; renderList(); }
  if (!S.open.has(key)) toggle(key);
  document.querySelector(`.game[data-key="${CSS.escape(key)}"]`)?.scrollIntoView({block: 'start'});
}
function filtered() {
  const f = S.f, day0 = new Date(new Date().toDateString()).getTime(), day = 864e5, q = f.q.toLowerCase();
  const inWhen = x => { if (f.when === 'all') return true; if (!x.kickoff) return false; const t = Date.parse(x.kickoff);
    return f.when === '7' ? t < day0 + 7 * day : t >= day0 + +f.when * day && t < day0 + (+f.when + 1) * day; };
  return live(S.data.fixtures).filter(x => inWhen(x) && (!f.sport || x.sport === f.sport) && (!f.league || x.league === f.league)
    && (!q || (x.home + ' ' + x.away + ' ' + x.competition).toLowerCase().includes(q)) && (!f.onlyForecast || x.probs_1x2))
    .sort((a, b) => (a.kickoff || a.date).localeCompare(b.kickoff || b.date));
}
function renderList() {
  document.querySelectorAll('#f-league option[data-sport]').forEach(o => o.hidden = !!S.f.sport && o.dataset.sport !== S.f.sport);
  const all = filtered(), rows = all.slice(0, S.limit);
  let html = `<p class="small muted">${all.length} jogos · ${all.filter(x => x.probs_1x2).length} com previsão · clique num jogo para ver a análise</p>`, last = '';
  for (const x of rows) {
    const dl = dayLabel(x);
    if (dl !== last) { html += `<div class="day">${esc(dl)}</div>`; last = dl; }
    html += `<article class="game ${S.open.has(x.key) ? 'open' : ''}" data-key="${esc(x.key)}">
      <div class="row" role="button" tabindex="0" aria-expanded="${S.open.has(x.key)}">
        <div class="time">${x.kickoff ? hm(x.kickoff) : esc(x.time || '—')}</div>
        <div class="teams"><b>${esc(x.home)}</b><b>${esc(x.away)}</b><span class="comp">${esc(x.competition)}${x.sport === 'Futebol' ? '' : ` · ${esc(x.sport)}`}</span></div>
        <div class="probs">${x.probs_1x2 ? probBar(x.probs_1x2) : ''}</div>
        <div class="pred">${x.probs_1x2 ? predCell(x) : '<span class="gl">Sem previsão: dados insuficientes</span>'}</div>
      </div><div class="detail" ${S.open.has(x.key) ? '' : 'hidden'}></div></article>`;
  }
  if (!rows.length) html += '<p class="muted">Sem jogos para estes filtros.</p>';
  if (all.length > rows.length) html += `<button class="btn more" id="more">Mostrar mais (${all.length - rows.length})</button>`;
  const list = document.getElementById('list');
  list.innerHTML = html;
  list.querySelectorAll('.game').forEach(g => {
    const key = g.dataset.key, row = g.querySelector('.row');
    row.onclick = () => toggle(key);
    row.onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target === row) { e.preventDefault(); toggle(key); } };
    if (S.open.has(key)) openDetail(key);
  });
  const more = document.getElementById('more');
  if (more) more.onclick = () => { S.limit += 60; renderList(); };
}
function toggle(key) {
  const g = document.querySelector(`.game[data-key="${CSS.escape(key)}"]`);
  const open = !S.open.has(key);
  if (open) S.open.add(key); else S.open.delete(key);
  if (g) { g.classList.toggle('open', open); g.querySelector('.detail').hidden = !open; g.querySelector('.row').setAttribute('aria-expanded', open); }
  if (open) openDetail(key);
  history.replaceState(null, '', open ? '#/match/' + encodeURIComponent(key) : '#/');
}
async function report(key) {
  if (!S.reports.has(key)) S.reports.set(key, api('/api/match?key=' + encodeURIComponent(key)));
  try { return await S.reports.get(key); } catch (e) { S.reports.delete(key); throw e; }
}
async function openDetail(key) {
  const box = document.querySelector(`.game[data-key="${CSS.escape(key)}"] .detail`);
  if (!box) return;
  if (!box.innerHTML) box.innerHTML = '<p class="muted">A carregar a análise…</p>';
  try { box.innerHTML = detailHtml(await report(key)); bindDetail(box, key); }
  catch (e) { box.innerHTML = err(e); }
}

// ---------- inline analysis ----------
function detailHtml(r) {
  const ds = r.data_status || {}, pr = r.predictions, id = r.identification;
  if (!pr) return `<p class="muted">Sem dados suficientes para prever este jogo.</p>${detailsPane(r)}`;
  const P = pr.probabilities, res = P['1X2'] || P.Vencedor, k = likelyOf(res);
  const tab = S.tab[r.key] || 'probs';
  const tabs = [['probs', 'Probabilidades'], ...(r.statistics ? [['stats', 'Estatísticas']] : []), ['detalhes', 'Dados e incertezas']];
  return `<div class="verdict"><div class="small muted">Resultado mais provável</div>
      <div class="big">${esc(selLabel('1X2', k, id.home, id.away))} · ${pct(res[k])}</div>
      <div class="small muted">${['1', 'X', '2'].filter(s => res[s] != null).map(s => `${esc(selLabel('1X2', s, id.home, id.away))} ${pct(res[s])}`).join(' · ')}</div></div>
    <div class="facts">
      ${pr.expected_goals ? `<div class="fact"><span>Golos esperados</span><b>${Object.values(pr.expected_goals).map(g => num(g)).join(' – ')}</b></div>` : ''}
      ${pr.top_scores?.length ? `<div class="fact"><span>Resultado exato mais provável</span><b>${esc(pr.top_scores[0].score)}</b> <span class="small muted">${pct(pr.top_scores[0].prob)}</span></div>` : ''}
      ${P['OU2.5'] && id.sport === 'Futebol' ? `<div class="fact"><span>Mais de 2.5 golos</span><b>${pct(P['OU2.5'].Mais)}</b></div>` : ''}
      ${P.BTTS ? `<div class="fact"><span>Ambas marcam</span><b>${pct(P.BTTS.Sim)}</b></div>` : ''}
      <div class="fact"><span>Confiança dos dados</span><b>${esc(ds.confidence || 'insuficiente')}</b></div>
      <div class="fact"><span>Analisado</span><b>${dt(ds.analysed_at)}</b></div>
    </div>
    <div class="tabs" role="tablist">${tabs.map(([t, l]) => `<button class="tab ${t === tab ? 'on' : ''}" role="tab" aria-selected="${t === tab}" data-tab="${t}">${l}</button>`).join('')}</div>
    <div class="pane">${{probs: probsPane, stats: statsPane, detalhes: detailsPane}[tab](r)}</div>`;
}
const pv = p => `<span class="pv">${pct(p)}</span>`;
function lines(P, prefix) {
  return Object.keys(P).filter(k => k.startsWith(prefix) && !isNaN(+k.slice(prefix.length))).sort((a, b) => +a.slice(prefix.length) - +b.slice(prefix.length));
}
function ouCard(P, prefix, title, note) {
  const ks = lines(P, prefix);
  if (!ks.length) return '';
  return `<div class="pcard"><h4>${title}</h4><table><tr><th>Linha</th><th>Mais</th><th>Menos</th></tr>
    ${ks.map(k => `<tr><td>${esc(k.slice(prefix.length))}</td><td class="${P[k].Mais >= .5 ? 'hi' : ''}">${pv(P[k].Mais)}</td><td class="${P[k].Menos > .5 ? 'hi' : ''}">${pv(P[k].Menos)}</td></tr>`).join('')}</table>
    ${note ? `<div class="note">${note}</div>` : ''}</div>`;
}
function rowsCard(title, rows, note) {
  const best = Math.max(...rows.map(r => r[1] ?? 0));
  return `<div class="pcard"><h4>${title}</h4><table>${rows.map(([l, p]) => `<tr><td>${esc(l)}</td><td class="${p === best ? 'hi' : ''}">${pv(p)}</td></tr>`).join('')}</table>${note ? `<div class="note">${note}</div>` : ''}</div>`;
}
const present = (o, keys) => keys.filter(k => o[k] != null);
// Every probability of the game, grouped by topic
function probsPane(r) {
  const pr = r.predictions, P = pr.probabilities, id = r.identification, [home, away] = [id.home, id.away];
  const res = P['1X2'] || P.Vencedor, cards = [];
  const sl = (m, s) => selLabel(m, s, home, away);
  cards.push(rowsCard('Resultado final', present(res, ['1', 'X', '2']).map(k => [sl('1X2', k), res[k]])));
  if (P.DC) cards.push(rowsCard('Dupla hipótese', ['1X', '12', 'X2'].map(k => [sl('DC', k), P.DC[k]])));
  if (P.WM) cards.push(rowsCard('Margem de vitória', present(P.WM, ['1 por 3+', '1 por 2', '1 por 1', 'X', '2 por 1', '2 por 2', '2 por 3+']).map(k => [sl('WM', k), P.WM[k]])));
  cards.push(ouCard(P, 'OU', `Total de ${UNIT[id.sport] || 'pontos'}`));
  if (P.EG) cards.push(rowsCard('Número exato de golos', ['0', '1', '2', '3', '4+'].map(k => [`${k} golo${k === '1' ? '' : 's'}`, P.EG[k]])));
  if (P.BTTS) cards.push(rowsCard('Ambas marcam', [['Sim', P.BTTS.Sim], ['Não', P.BTTS['Não']]]));
  if (P.CS) cards.push(rowsCard('Baliza a zeros', [[sl('CS', '1'), P.CS['1']], [sl('CS', '2'), P.CS['2']]]));
  cards.push(ouCard(P, 'GC', `Golos de ${esc(home)}`), ouCard(P, 'GF', `Golos de ${esc(away)}`));
  if (P.HT1X2) cards.push(rowsCard('Resultado ao intervalo', ['1', 'X', '2'].map(k => [sl('HT1X2', k), P.HT1X2[k]]),
    pr.halftime ? `Golos esperados na 1.ª parte: ${Object.values(pr.halftime.expected_goals).map(g => num(g)).join(' – ')} (${pct(pr.halftime.goal_share, 0)} dos golos desta liga são marcados antes do intervalo).` : ''));
  cards.push(ouCard(P, 'HTOU', 'Golos ao intervalo'));
  if (P.HTFT) {
    const n = {'1': home, X: 'Empate', '2': away};
    cards.push(`<div class="pcard"><h4>Intervalo / final</h4><table><tr><th>Intervalo ↓ · Final →</th>${['1', 'X', '2'].map(b => `<th>${esc(n[b])}</th>`).join('')}</tr>
      ${['1', 'X', '2'].map(a => `<tr><td>${esc(n[a])}</td>${['1', 'X', '2'].map(b => `<td>${pv(P.HTFT[`${a}/${b}`])}</td>`).join('')}</tr>`).join('')}</table>
      <div class="note">Linha = quem está a ganhar ao intervalo; coluna = resultado final.</div></div>`);
  }
  if (P['2H1X2']) cards.push(rowsCard('Segunda parte', ['1', 'X', '2'].map(k => [sl('2H1X2', k), P['2H1X2'][k]])));
  if (P.MP) cards.push(rowsCard('Parte com mais golos', ['1ª parte', '2ª parte', 'Igual'].map(k => [sl('MP', k), P.MP[k]])));
  const exp = (s, what) => s ? `Esperados: ${esc(home)} ${num(s.home, 1)} · ${esc(away)} ${num(s.away, 1)} (média da liga ${num(s.league_total, 1)} ${what} por jogo).` : '';
  cards.push(ouCard(P, 'RE', 'Remates (total do jogo)', exp(pr.shots, 'remates')));
  cards.push(ouCard(P, 'RB', 'Remates à baliza (total do jogo)', exp(pr.shots_on_target, 'remates à baliza')));
  cards.push(ouCard(P, 'CO', 'Cantos (total do jogo)', pr.corners ? `Média da liga: ${num(pr.corners.league_total, 1)} cantos por jogo. Médias recentes: ${esc(home)} ${num(pr.corners.home, 1)} · ${esc(away)} ${num(pr.corners.away, 1)}.
    As probabilidades usam a frequência real da liga no último ano: as médias de cada equipa não melhoraram a previsão no teste.` : ''));
  cards.push(ouCard(P, 'CA', 'Cartões amarelos (total do jogo)', pr.cards ? `${exp(pr.cards, 'cartões')} O árbitro não entra no cálculo.` : ''));
  const ah = Object.keys(P).filter(k => k.startsWith('AH'));
  if (ah.length) cards.push(rowsCard('Handicap', ah.flatMap(k => ['1', '2'].map(s => [sl(k, s), P[k][s]]))));
  let heat = '';
  if (pr.matrix) {
    const m = pr.matrix, mx = Math.max(...m.flat());
    heat = `<div class="pcard"><h4>Resultado exato (linhas: ${esc(home)}, colunas: ${esc(away)})</h4><div class="tbl" style="border:0"><table class="heat"><tr><th></th>${m.map((_, j) => `<th>${j}</th>`).join('')}</tr>
      ${m.map((row, i) => `<tr><th>${i}</th>${row.map(p => `<td style="background:color-mix(in srgb,var(--accent2) ${Math.round(p / mx * 60)}%,transparent)">${(p * 100).toFixed(1)}</td>`).join('')}</tr>`).join('')}</table></div>
      <div class="note">Probabilidade de cada resultado, em %. Mais prováveis: ${pr.top_scores.slice(0, 5).map(s => `${esc(s.score)} (${pct(s.prob)})`).join(', ')}.</div></div>`;
  }
  return `<div class="pgrid">${cards.join('')}${heat}</div>
    <p class="small muted">Resultado final, total de golos e ambas marcam combinam o nosso modelo com o consenso do mercado; os golos esperados são ajustados a
    essas probabilidades, e daí saem o resultado exato, o intervalo e os golos por equipa. Remates, cartões e intervalo foram testados em jogos reais de 2025/26
    e preveem melhor do que as médias da liga; os cantos usam a frequência da liga.</p>`;
}
function formTable(obj, title) {
  return `<h3>${title}</h3><div class="tbl"><table><tr><th>Equipa</th><th>J</th><th>Forma</th><th>Pts/J</th><th>GM</th><th>GS</th><th class="hide-sm">xG</th><th class="hide-sm">xGA</th></tr>
  ${Object.entries(obj).map(([t, s]) => `<tr><td>${esc(t)}</td><td>${s.matches}</td><td>${esc(s.form || '—')}</td><td>${num(s.points_per_game)}</td>
  <td>${num(s.goals_for)}</td><td>${num(s.goals_against)}</td><td class="hide-sm">${num(s.xg_for)}</td><td class="hide-sm">${num(s.xg_against)}</td></tr>`).join('')}</table></div>`;
}
function statsPane(r) {
  const st = r.statistics, pr = r.predictions, [home, away] = [r.identification.home, r.identification.away];
  return `${formTable(st.form, 'Forma recente (últimos 5)')}
    ${formTable({[home + ' (casa)']: st.home_away[home], [away + ' (fora)']: st.home_away[away]}, 'Casa / fora (últimos 10)')}
    <div class="grid2"><div><h3>Força (1 = média da liga)</h3><div class="tbl"><table>${st.ratings ? Object.entries(st.ratings).map(([t, x]) =>
      `<tr><td>${esc(t)}</td><td>ataque ${num(x.attack)}</td><td>defesa ${num(x.defence)}</td></tr>`).join('') : ''}
      <tr><td>Vantagem casa</td><td colspan="2">${num(st.home_advantage)}</td></tr>
      <tr><td>Dias de descanso</td><td colspan="2">${esc(home)} ${st.rest_days[home] ?? '—'} · ${esc(away)} ${st.rest_days[away] ?? '—'}</td></tr></table></div>
      <p class="small muted">Ataque acima de 1 = marca mais do que a média; defesa acima de 1 = sofre mais.</p></div>
    <div><h3>Confrontos diretos</h3>${st.h2h.length ? `<div class="tbl"><table>${st.h2h.map(g => `<tr><td>${esc(g.date)}</td><td>${esc(g.home)} ${esc(g.score)} ${esc(g.away)}</td></tr>`).join('')}</table></div>` : '<p class="muted">Sem confrontos no período.</p>'}
    ${pr?.model_expected_goals ? `<h3>Golos esperados</h3><p class="small">Final: ${Object.values(pr.expected_goals).map(g => num(g)).join(' – ')} · só o nosso modelo: ${Object.values(pr.model_expected_goals).map(g => num(g)).join(' – ')}</p>` : ''}</div></div>`;
}
function detailsPane(r) {
  const ds = r.data_status || {}, c = r.conclusion, pr = r.predictions;
  return `<h3>Incertezas</h3><ul>${(c?.uncertainties || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <h3>Método e fontes</h3><p class="small">${pr ? esc(pr.method) + '. ' : ''}${ds.results ? `Resultados e estatísticas: ${esc(ds.results.source)}, ${ds.results.matches} jogos (último ${esc(ds.results.last_result)}). ` : ''}
    ${(ds.odds || []).length ? 'O consenso do mercado entra como referência para afinar as probabilidades.' : ''}</p>
    ${ds.error ? `<div class="warn">${esc(ds.error)}</div>` : ''}`;
}
function bindDetail(box, key) {
  box.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab[key] = b.dataset.tab; openDetail(key); });
}

// ---------- how it works ----------
async function renderHow() {
  const box = document.getElementById('how-body');
  const perf = await api('/api/performance').catch(() => null), pm = perf ? Object.entries(perf.markets).filter(([g]) => g !== 'outros') : [];
  const name = {todos: 'Todas as previsões', '1X2': 'Resultado final', Vencedor: 'Vencedor (outras modalidades)', 'OU2.5': 'Mais/menos de 2.5 golos', BTTS: 'Ambas marcam'};
  box.innerHTML = `<h3>Acerto das previsões</h3>${pm.length ? `<p class="muted">Previsões publicadas por este site, comparadas com o resultado real. Log loss e Brier medem o erro: menor é melhor.</p>
      <div class="tbl"><table><tr><th>Previsão</th><th>Jogos</th><th>Log loss</th><th>Brier</th></tr>
      ${pm.map(([g, m]) => `<tr><td>${esc(name[g] || g)}</td><td>${m.games}</td><td>${num(m.log_loss, 4)}</td><td>${num(m.brier, 4)}</td></tr>`).join('')}</table></div>` : '<p class="muted">Ainda não há previsões com resultado conhecido.</p>'}
    <h3>Como é feita a previsão</h3><ul>
      <li><b>Futebol</b>: modelo Dixon-Coles — os golos de cada equipa dependem do seu ataque, da defesa do adversário e da vantagem de jogar em casa, com mais peso aos jogos recentes.
        A probabilidade final combina este modelo com o consenso do mercado, com pesos testados em 8 épocas e 21 ligas.</li>
      <li>Os golos esperados são ajustados a essas probabilidades finais; daí sai a grelha de resultados exatos, de onde vêm golos por equipa, intervalo, margem de vitória e handicap — tudo coerente entre si.</li>
      <li><b>Remates e cartões</b>: médias recentes de cada equipa, puxadas para a média da liga. <b>Cantos</b>: frequência da liga no último ano.</li>
      <li><b>Outras modalidades</b>: consenso do mercado; ainda sem modelo próprio.</li>
      <li><b>Confiança dos dados</b>: quantos jogos de histórico têm as equipas. Não é a probabilidade do resultado.</li></ul>
    <h3>Limitações</h3><ul><li>Sem lesões, suspensões, onzes nem meteorologia.</li><li>Só jogos do campeonato contam para a força das equipas.</li>
      <li>Os dados são atualizados de hora a hora (o GitHub pode atrasar algumas atualizações). Esta página verifica dados novos a cada 5 minutos.</li></ul>`;
}

// ---------- start ----------
load(true).then(() => {
  const h = location.hash;
  if (h.startsWith('#/match/')) goTo(decodeURIComponent(h.slice(8)));
}).catch(e => { $app.innerHTML = err(e); });
setInterval(() => load(false).catch(() => {}), REFRESH_MS);
setInterval(renderUpd, 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false).catch(() => {}); });
</script>
</body>
